[package]
name = "bootcha1n"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
authors = ["grimh3xx"]
description = "bootcha1n — read-only UEFI Secure Boot key-hierarchy and TPM measured-boot auditor"
repository = "https://github.com/grimh3xx/bootcha1n"
license = "MIT"
keywords = ["security", "uefi", "secure-boot", "tpm", "blue-team"]
categories = ["command-line-utilities"]
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
owo-colors = { version = "4", features = ["supports-colors"] }
anyhow = "1"
anstream = "0.6"
x509-parser = "0.16"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_System_TpmBaseServices",
    "Win32_System_Registry",
] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
